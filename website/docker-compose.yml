version: '3.8'

services:
  website:
    build: .
    ports:
      - "3000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    
  dev:
    image: hugomods/hugo:exts
    working_dir: /src
    volumes:
      - .:/src
    ports:
      - "1313:1313"
    command: hugo server --bind 0.0.0.0 --baseURL http://localhost:1313