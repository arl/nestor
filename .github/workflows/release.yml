name: Release

on:
  push:
    tags:
      - "v*.*.*" # Triggers on version tag pushes

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, macos-15]
        include:
          - os: ubuntu-latest
            arch: x86-64
            asset_name: nestor-linux-x64.tgz
          - os: macos-13
            arch: x86-64
            asset_name: nestor-macos-x64.tgz
          - os: macos-15
            arch: arm64
            asset_name: nestor-macos-arm64.tgz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libgtk-3-dev

      - name: Build Nestor
        run: go build -ldflags="-s -w" .

      - name: Package binary
        run: tar -czvf ${{ matrix.asset_name }} nestor

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
