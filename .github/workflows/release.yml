name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux/amd64
            goos: linux
            goarch: amd64
          - os: macos-13
            name: macOS/amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            name: macOS/arm64
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libgtk-3-dev

      - name: Build Binary
        env:
          CGO_ENABLED: 1
        run: |
          VERSION="${{ github.ref_name }}"
          
          go build -trimpath -ldflags="-s -w" -o nestor .
          
          # Create archive
          tar czf nestor_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz nestor LICENSE.md README.md
          
          # Generate checksum
          if [ "$RUNNER_OS" == "Linux" ]; then
            sha256sum nestor_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > nestor_${VERSION}_checksums_${{ matrix.goos }}_${{ matrix.goarch }}.txt
          else
            shasum -a 256 nestor_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > nestor_${VERSION}_checksums_${{ matrix.goos }}_${{ matrix.goarch }}.txt
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nestor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nestor_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            nestor_${{ github.ref_name }}_checksums_${{ matrix.goos }}_${{ matrix.goarch }}.txt
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nestor-*
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Formula
        uses: Justintime50/homebrew-releaser@v1
        with:
          homebrew_owner: arl
          homebrew_tap: homebrew-arl
          formula_folder: Formula
          
          # Note: GITHUB_TOKEN doesn't have permission to push to other repos
          # If this fails, create a Personal Access Token with repo scope
          # and add it as a secret named HOMEBREW_TAP_TOKEN
          github_token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}
          
          commit_owner: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com
          
          install: 'bin.install "nestor"'
          
          # Add caveats for macOS quarantine handling
          formula_includes: |
            def caveats
              <<~EOS
                The nestor binary is not signed. On macOS, you may need to remove
                the quarantine attribute to run it:
                  xattr -d com.apple.quarantine $(which nestor)
              EOS
            end
          
          # Target files to download for formula
          target_darwin_amd64: true
          target_darwin_arm64: true
          target_linux_amd64: true
          
          update_readme_table: false
          
          skip_commit: false
          
          debug: false
