name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux/amd64
            goos: linux
            goarch: amd64
          - os: macos-13
            name: macOS/amd64
            goos: darwin
            goarch: amd64
          - os: macos-latest
            name: macOS/arm64
            goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libgtk-3-dev

      - name: Build Binary
        env:
          CGO_ENABLED: 1
        run: |
          # Get version without 'v' prefix for Homebrew compatibility
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"

          go build -trimpath -ldflags="-s -w" -o nestor .

          # Create archive - use version without 'v' prefix for Homebrew Releaser action
          tar czf nestor_${VERSION_NO_V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz nestor LICENSE.md README.md

          # Generate checksum with matching filename prefix
          if [ "$RUNNER_OS" == "Linux" ]; then
            sha256sum nestor_${VERSION_NO_V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > nestor_${VERSION_NO_V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
          else
            shasum -a 256 nestor_${VERSION_NO_V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz > nestor_${VERSION_NO_V}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nestor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            nestor_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
            nestor_*_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nestor-*
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew Formula
        uses: Justintime50/homebrew-releaser@v2
        with:
          homebrew_owner: arl
          homebrew_tap: homebrew-arl
          formula_folder: Formula

          # Note: GITHUB_TOKEN doesn't have permission to push to other repos.
          # Need a Personal access token with 'repo' scope.
          github_token: ${{ secrets.HOMEBREW_GITHUB_TOKEN }}

          commit_owner: github-actions[bot]
          commit_email: github-actions[bot]@users.noreply.github.com

          install: 'bin.install "nestor"'
          test: 'assert_match("{{ github.ref_name }}", shell_output("nestor -version"))'

          # Add caveats for macOS quarantine handling
          formula_includes: |
            def caveats
              <<~EOS
                The nestor binary is not signed. On macOS, you may need to remove
                the quarantine attribute to run it:
                  xattr -d com.apple.quarantine $(which nestor)
              EOS
            end

          # Target files to download for formula
          target_darwin_amd64: true
          target_darwin_arm64: true
          target_linux_amd64: true

          update_readme_table: false

          skip_commit: false

          debug: false

  verify-homebrew:
    name: Verify Homebrew Installation
    needs: homebrew
    runs-on: macos-latest
    steps:
      - name: Install from Homebrew
        run: |
          brew tap arl/arl
          brew install nestor

      - name: Verify Installation
        run: |
          # Check that nestor is installed
          which nestor

          # Get the installed version
          INSTALLED_VERSION=$(nestor -version 2>&1 || echo "version command failed")
          echo "Installed version output: $INSTALLED_VERSION"

          # Extract tag version (e.g., v0.1.0 -> 0.1.0)
          EXPECTED_VERSION="${{ github.ref_name }}"
          echo "Expected version tag: $EXPECTED_VERSION"

          # Verify the version output contains expected information
          if echo "$INSTALLED_VERSION" | grep -q "version"; then
            echo "✓ Version command executed successfully"
          else
            echo "✗ Version command failed or produced unexpected output"
            exit 1
          fi
