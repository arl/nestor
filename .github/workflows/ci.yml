on: [push, pull_request]
name: test and build on linux
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        id: cache
        with:
          path: tests
          key: tests-dir

      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"

      - name: go generate check
        run: |
          go generate ./...
          git diff --name-only --exit-code

      - name: Dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install libasound2-dev libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev libgtk-3-dev

      # Run tests
      - name: Run tests
        env:
          DISPLAY: ":99.0"
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          go test -shuffle=on ./...
