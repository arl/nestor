version: 2
project_name: nestor

# This GoReleaser config is currently not used for the main release workflow.
# Binaries are built directly in GitHub Actions on their native platforms due to CGO requirements.
# This file is kept for potential future use or local testing.

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
